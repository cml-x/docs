<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CamelX is an integration middleware hub connecting client applications (CRM, ERP, e-commerce, mobile, partner portal) to backend systems (database, legacy system, cloud service, data warehouse, file server).">
  <defs>
    <marker id="hxArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9DC3FF"/>
    </marker>
    <radialGradient id="hxHubGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4589FF"/>
      <stop offset="55%" stop-color="#0F62FE"/>
      <stop offset="100%" stop-color="#0043CE"/>
    </radialGradient>
    <filter id="hxCardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F1C32" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F1C32" flood-opacity="0.08"/>
    </filter>
    <filter id="hxHubShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001141" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#001141" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- connectors: converge on the hub -->
  <g stroke="#9DC3FF" stroke-width="2" marker-start="url(#hxArrow)" marker-end="url(#hxArrow)">
    <line x1="159"  y1="150" x2="495.8" y2="264.6"/>
    <line x1="380"  y1="150" x2="509.1" y2="238.1"/>
    <line x1="601"  y1="150" x2="600.7" y2="190"/>
    <line x1="822"  y1="150" x2="691.2" y2="238.4"/>
    <line x1="1043" y1="150" x2="704.2" y2="264.7"/>

    <line x1="159"  y1="460" x2="496.6" y2="337.5"/>
    <line x1="380"  y1="460" x2="511.0" y2="364.7"/>
    <line x1="601"  y1="460" x2="600.7" y2="410"/>
    <line x1="822"  y1="460" x2="689.2" y2="364.3"/>
    <line x1="1043" y1="460" x2="703.5" y2="337.4"/>
  </g>

  <!-- ============ TOP ROW: client applications ============ -->
  <g filter="url(#hxCardShadow)">
    <rect x="61"  y="40" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="282" y="40" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="503" y="40" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="724" y="40" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="945" y="40" width="196" height="110" rx="14" fill="#FFFFFF"/>
  </g>

  <!-- CRM: contact icon -->
  <g transform="translate(146,78)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="9" r="4.16"/>
    <path d="M5.2 22.1c0-4.29 3.51-6.5 7.8-6.5s7.8 2.21 7.8 6.5"/>
  </g>
  <!-- ERP: settings icon -->
  <g transform="translate(367,78)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="13" r="4.42"/>
    <line x1="19.5" y1="13" x2="23.4" y2="13"/>
    <line x1="16.25" y1="18.63" x2="18.2" y2="22.01"/>
    <line x1="9.75" y1="18.63" x2="7.8" y2="22.01"/>
    <line x1="6.5" y1="13" x2="2.6" y2="13"/>
    <line x1="9.75" y1="7.37" x2="7.8" y2="3.99"/>
    <line x1="16.25" y1="7.37" x2="18.2" y2="3.99"/>
  </g>
  <!-- E-Commerce: cart icon -->
  <g transform="translate(588,78)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.6 3.9h2.6l2.86 14.56a2.6 2.6 0 0 0 2.6 2.08h8.32a2.6 2.6 0 0 0 2.6-2.08L23.4 8.45H7.02"/>
    <circle cx="9.75" cy="23.4" r="1.69" fill="#0F62FE" stroke="none"/>
    <circle cx="18.85" cy="23.4" r="1.69" fill="#0F62FE" stroke="none"/>
  </g>
  <!-- Mobile App: phone icon -->
  <g transform="translate(809,78)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.8" y="0.6" width="14.4" height="24.8" rx="2.6"/>
    <line x1="10.7" y1="19.5" x2="15.3" y2="19.5"/>
  </g>
  <!-- Partner Portal: globe icon -->
  <g transform="translate(1030,78)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="13" r="10.4"/>
    <ellipse cx="13" cy="13" rx="4.16" ry="10.4"/>
    <line x1="2.6" y1="13" x2="23.4" y2="13"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#21272A" text-anchor="middle">
    <text x="159"  y="122">CRM</text>
    <text x="380"  y="122">ERP</text>
    <text x="601"  y="122">E-Commerce</text>
    <text x="822"  y="122">Mobile App</text>
    <text x="1043" y="122">Partner Portal</text>
  </g>

  <!-- ============ CENTRAL HUB: CamelX ============ -->
  <circle cx="600" cy="300" r="110" fill="url(#hxHubGradient)" filter="url(#hxHubShadow)"/>
  <text x="600" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">CamelX</text>
  <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#D0E2FF" letter-spacing="1.5">MIDDLEWARE</text>

  <!-- ============ BOTTOM ROW: backend systems ============ -->
  <g filter="url(#hxCardShadow)">
    <rect x="61"  y="460" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="282" y="460" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="503" y="460" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="724" y="460" width="196" height="110" rx="14" fill="#FFFFFF"/>
    <rect x="945" y="460" width="196" height="110" rx="14" fill="#FFFFFF"/>
  </g>

  <!-- Database: cylinder icon -->
  <g transform="translate(146,498)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="13" cy="6.5" rx="10.4" ry="3.9"/>
    <line x1="2.6" y1="6.5" x2="2.6" y2="19.5"/>
    <line x1="23.4" y1="6.5" x2="23.4" y2="19.5"/>
    <path d="M2.6 19.5a10.4 3.9 0 0 0 20.8 0"/>
  </g>
  <!-- Legacy System: archive icon -->
  <g transform="translate(367,498)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.6" y="3.9" width="20.8" height="5.2" rx="1.3"/>
    <rect x="3.9" y="9.1" width="18.2" height="13" rx="1.3"/>
    <line x1="10.4" y1="6.5" x2="15.6" y2="6.5"/>
  </g>
  <!-- Cloud Service: cloud icon -->
  <g transform="translate(588,498)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.2 19.5c-2.21 0-3.9-1.69-3.9-3.9 0-1.95 1.43-3.51 3.25-3.77.26-3.12 2.73-5.53 5.85-5.53 2.47 0 4.55 1.56 5.33 3.77 2.86.13 5.07 2.34 5.07 5.07 0 2.34-1.95 4.29-4.29 4.29z"/>
  </g>
  <!-- Data Warehouse: layers icon -->
  <g transform="translate(809,498)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.6" y="3.25" width="20.8" height="5.85" rx="1.3"/>
    <rect x="2.6" y="10.4" width="20.8" height="5.85" rx="1.3"/>
    <rect x="2.6" y="17.55" width="20.8" height="5.85" rx="1.3"/>
  </g>
  <!-- File Server: folder icon -->
  <g transform="translate(1030,498)" fill="none" stroke="#0F62FE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.6 7.15h7.8l2.6 3.25h10.4v11.7H2.6z"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#21272A" text-anchor="middle">
    <text x="159"  y="542">Database</text>
    <text x="380"  y="535">Legacy</text>
    <text x="380"  y="550">System</text>
    <text x="601"  y="542">Cloud Service</text>
    <text x="822"  y="535">Data</text>
    <text x="822"  y="550">Warehouse</text>
    <text x="1043" y="542">File Server</text>
  </g>
</svg>
