<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F62FE" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#EDF5FF" />
  
  <text x="400" y="30" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#161616" text-anchor="middle">CAMEL X</text>
  
  <!-- Row 1: Build -->
  <text x="40" y="85" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#6F6F6F">1. Build</text>
  <rect x="250" y="60" width="300" height="50" fill="#0F62FE" rx="4" />
  <text x="400" y="80" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Project Manager</text>
  <text x="400" y="98" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Build integrations, manage releases</text>
  
  <!-- Arrows from Row 1 to Row 2 -->
  <path d="M 400 110 L 400 140" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Row 2: Run -->
  <text x="40" y="165" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#6F6F6F">2. Run</text>
  <rect x="150" y="140" width="230" height="50" fill="#0F62FE" rx="4" />
  <text x="265" y="160" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Runtime Manager</text>
  <text x="265" y="178" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Deploy &amp; run flows</text>
  
  <rect x="420" y="140" width="230" height="50" fill="#0F62FE" rx="4" />
  <text x="535" y="160" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Environment Manager</text>
  <text x="535" y="178" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Targets &amp; environments</text>
  
  <path d="M 400 190 L 400 220" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Row 3: Expose & Secure -->
  <text x="40" y="245" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#6F6F6F">3. Expose &amp; Secure</text>
  <rect x="60" y="220" width="210" height="50" fill="#0F62FE" rx="4" />
  <text x="165" y="240" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">API Manager</text>
  <text x="165" y="258" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Expose APIs</text>
  
  <rect x="295" y="220" width="210" height="50" fill="#0F62FE" rx="4" />
  <text x="400" y="240" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Auth Manager</text>
  <text x="400" y="258" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Identity Provider</text>

  <rect x="530" y="220" width="210" height="50" fill="#0F62FE" rx="4" />
  <text x="635" y="240" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Access Manager</text>
  <text x="635" y="258" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Users &amp; permissions</text>
  
  <path d="M 400 270 L 400 300" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Row 4: Observe & Store -->
  <text x="40" y="325" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#6F6F6F">4. Observe &amp; Store</text>
  <rect x="60" y="300" width="210" height="50" fill="#0F62FE" rx="4" />
  <text x="165" y="320" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Monitoring</text>
  <text x="165" y="338" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Dashboards, logs, metrics</text>

  <rect x="295" y="300" width="210" height="50" fill="#E0E0E0" stroke="#C6C6C6" rx="4" />
  <text x="400" y="320" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Secrets Manager</text>
  <text x="400" y="338" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Credentials &amp; config</text>

  <rect x="530" y="300" width="210" height="50" fill="#E0E0E0" stroke="#C6C6C6" rx="4" />
  <text x="635" y="320" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Assets Explorer</text>
  <text x="635" y="338" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Component library</text>
</svg>
