<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F62FE" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#EDF5FF" />
  
  <rect x="200" y="20" width="200" height="60" fill="#0F62FE" rx="4" />
  <text x="300" y="45" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Project</text>
  <text x="300" y="65" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Git repository</text>
  
  <path d="M 300 80 L 300 110" stroke="#0F62FE" stroke-width="2" />
  <path d="M 90 110 L 510 110" stroke="#0F62FE" stroke-width="2" />
  
  <path d="M 90 110 L 90 130" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="20" y="130" width="140" height="50" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2" rx="4" />
  <text x="90" y="150" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Integration</text>
  <text x="90" y="168" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Camel routes</text>

  <path d="M 230 110 L 230 130" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="170" y="130" width="120" height="50" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2" rx="4" />
  <text x="230" y="150" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">API Specification</text>
  <text x="230" y="168" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">OpenAPI / AsyncAPI / Avro</text>

  <path d="M 370 110 L 370 130" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="310" y="130" width="120" height="50" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2" rx="4" />
  <text x="370" y="150" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Kamelet</text>
  <text x="370" y="168" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Reusable connector</text>

  <path d="M 510 110 L 510 130" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="450" y="130" width="120" height="50" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2" rx="4" />
  <text x="510" y="150" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Pipe</text>
  <text x="510" y="168" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Kamelet-to-Kamelet</text>

  <!-- From Integration down to Release and Template -->
  <path d="M 90 180 L 90 200" stroke="#0F62FE" stroke-width="2" />
  <path d="M 40 200 L 140 200" stroke="#0F62FE" stroke-width="2" />
  
  <path d="M 40 200 L 40 220" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="5" y="220" width="70" height="60" fill="#24A148" rx="4" />
  <text x="40" y="240" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Release</text>
  <text x="40" y="258" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Tagged deployable version</text>
  
  <path d="M 140 200 L 140 220" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="95" y="220" width="90" height="60" fill="#E0E0E0" stroke="#C6C6C6" rx="4" />
  <text x="140" y="240" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Template</text>
  <text x="140" y="258" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Pre-built starting point</text>
</svg>
