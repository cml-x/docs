<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" role="img" aria-label="A private link: integrations of the environment call remote applications by name through a tunnel, and the remote side calls open services of the environment on its tunnel address.">
  <rect width="800" height="360" fill="#EDF5FF"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0F62FE"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#525252"/>
    </marker>
  </defs>

  <!-- Environment -->
  <rect x="24" y="40" width="330" height="280" fill="#FFFFFF" stroke="#C6C6C6" rx="4"/>
  <text x="40" y="64" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#161616" font-weight="bold">Environment</text>

  <rect x="44" y="92" width="130" height="52" fill="#E0E0E0" stroke="#C6C6C6" rx="4"/>
  <text x="109" y="114" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#161616" text-anchor="middle" font-weight="bold">Integration</text>
  <text x="109" y="131" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle">calls sap-erp:443</text>

  <rect x="44" y="232" width="130" height="52" fill="#E0E0E0" stroke="#C6C6C6" rx="4"/>
  <text x="109" y="254" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#161616" text-anchor="middle" font-weight="bold">orders-api</text>
  <text x="109" y="271" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle">port 8080</text>

  <rect x="214" y="92" width="124" height="192" fill="#D0E2FF" stroke="#0F62FE" rx="4"/>
  <text x="276" y="176" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#161616" text-anchor="middle" font-weight="bold">Private link</text>
  <text x="276" y="194" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle">10.250.0.2</text>

  <line x1="174" y1="118" x2="210" y2="118" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="214" y1="258" x2="178" y2="258" stroke="#525252" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Tunnel -->
  <rect x="354" y="150" width="92" height="76" fill="#0F62FE" opacity="0.12"/>
  <line x1="338" y1="170" x2="458" y2="170" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="462" y1="206" x2="342" y2="206" stroke="#525252" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="400" y="142" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle" font-weight="bold">Tunnel</text>
  <text x="400" y="244" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" fill="#525252" text-anchor="middle">opened by the</text>
  <text x="400" y="258" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" fill="#525252" text-anchor="middle">environment</text>

  <!-- Remote network -->
  <rect x="446" y="40" width="330" height="280" fill="#FFFFFF" stroke="#C6C6C6" rx="4"/>
  <text x="462" y="64" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" fill="#161616" font-weight="bold">Remote network</text>
  <text x="760" y="64" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="end">10.20.0.0/16</text>

  <rect x="462" y="92" width="124" height="192" fill="#E0E0E0" stroke="#C6C6C6" rx="4"/>
  <text x="524" y="176" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#161616" text-anchor="middle" font-weight="bold">Remote side</text>
  <text x="524" y="194" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle">10.250.0.1</text>

  <rect x="626" y="92" width="134" height="52" fill="#E0E0E0" stroke="#C6C6C6" rx="4"/>
  <text x="693" y="114" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#161616" text-anchor="middle" font-weight="bold">SAP</text>
  <text x="693" y="131" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle">10.20.1.15:443</text>

  <rect x="626" y="232" width="134" height="52" fill="#E0E0E0" stroke="#C6C6C6" rx="4"/>
  <text x="693" y="254" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" fill="#161616" text-anchor="middle" font-weight="bold">A remote system</text>
  <text x="693" y="271" font-family="IBM Plex Mono, monospace" font-size="10" fill="#525252" text-anchor="middle">calls 10.250.0.2:8443</text>

  <line x1="586" y1="118" x2="622" y2="118" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="626" y1="258" x2="590" y2="258" stroke="#525252" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Legend -->
  <line x1="40" y1="340" x2="70" y2="340" stroke="#0F62FE" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="80" y="344" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616">Remote applications: the environment calls the remote network</text>
  <line x1="446" y1="340" x2="476" y2="340" stroke="#525252" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="486" y="344" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616">Open services: the remote side calls the environment</text>
</svg>
