<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0F62FE"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#EDF5FF"/>
  
  <rect x="250" y="30" width="300" height="60" rx="4" fill="#0F62FE"/>
  <text x="400" y="65" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Organization</text>

  <rect x="150" y="160" width="120" height="60" rx="4" fill="#0F62FE"/>
  <text x="210" y="195" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">User</text>

  <rect x="350" y="160" width="160" height="60" rx="4" fill="#E0E0E0" stroke="#C6C6C6" stroke-width="2"/>
  <text x="430" y="195" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Identity Provider</text>

  <line x1="270" y1="190" x2="350" y2="190" stroke="#C6C6C6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="310" y="180" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#6F6F6F" text-anchor="middle">SSO federation</text>

  <line x1="300" y1="90" x2="250" y2="160" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="40" width="200" height="50" rx="4" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2"/>
  <text x="680" y="60" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">MFA Policy</text>
  <text x="680" y="80" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">TOTP / U2F / SMS / Email OTP</text>
  <line x1="550" y1="60" x2="580" y2="60" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="580" y="120" width="200" height="50" rx="4" fill="#E0E0E0" stroke="#C6C6C6" stroke-width="2"/>
  <text x="680" y="140" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Security Settings</text>
  <text x="680" y="160" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Login / Password / Lockout policies</text>
  <line x1="500" y1="90" x2="580" y2="130" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="280" width="220" height="120" rx="4" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2"/>
  <text x="150" y="305" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Admin Role</text>
  <text x="150" y="325" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Owner / Viewer</text>
  <text x="150" y="345" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">User Manager</text>
  <text x="150" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Permission Editor</text>
  <text x="150" y="385" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">Project Editor</text>
  <line x1="180" y1="220" x2="160" y2="280" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="300" y="280" width="220" height="60" rx="4" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2"/>
  <text x="410" y="305" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#161616" text-anchor="middle">Project Authorization</text>
  <text x="410" y="325" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" fill="#161616" text-anchor="middle">User + Project + Project Roles</text>
  <line x1="240" y1="220" x2="350" y2="280" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="300" y="390" width="220" height="50" rx="4" fill="#0F62FE"/>
  <text x="410" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Project</text>
  <line x1="410" y1="340" x2="410" y2="390" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>
</svg>
