  <text x="390" y="235" fill="#161616" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" text-anchor="middle">4. Access Token</text>

  <path d="M570 190 L670 190" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="180" fill="#161616" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" text-anchor="middle">5. API Call (JWT)</text>

  <rect x="680" y="160" width="130" height="60" fill="#0F62FE" rx="4"/>
  <text x="745" y="195" fill="#FFFFFF" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">API Manager</text>
  <text x="745" y="210" fill="#FFFFFF" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" text-anchor="middle">/ Resource</text>
