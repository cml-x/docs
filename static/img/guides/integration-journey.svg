  <rect x="620" y="140" width="180" height="40" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2" rx="4"/>
  <text x="710" y="165" fill="#161616" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" text-anchor="middle">View Logs &amp; Metrics</text>

  <!-- Horizontal Connections -->
  <path d="M200 220 L410 220" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="215" fill="#161616" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" text-anchor="middle">Release to Deploy</text>

  <path d="M400 160 L410 100" stroke="#0F62FE" stroke-width="2" marker-end="url(#arr)"/>
  <text x="405" y="130" fill="#161616" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" text-anchor="middle">Env</text>
